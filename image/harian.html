<!doctype html>
<html lang="ms">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bijak Pecahan | Ingatan</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family: "Press Start 2P", cursive;
        background: url("image/background.jpg") no-repeat center center fixed;
        background-size: cover;
        overflow: hidden;
        color: white;
        height: 100vh;
      }
      .stars {
        position: fixed;
        width: 100%;
        height: 100%;
        background: transparent;
        z-index: -1;
        overflow: hidden;
      }
      .star {
        position: absolute;
        width: 2px;
        height: 2px;
        background: white;
        border-radius: 50%;
        animation: blink 2s infinite ease-in-out;
      }
      @keyframes blink {
        0%,
        100% {
          opacity: 0.2;
        }
        50% {
          opacity: 1;
        }
      }

      .navbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 15px 30px;
        background: rgba(10, 10, 40, 0.85);
        position: fixed;
        width: 100%;
        top: 0;
        z-index: 100;
      }
      .nav-left {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .nav-left img {
        width: 45px;
        height: 45px;
        border-radius: 50%;
      }
      .nav-title {
        font-size: 12px;
        background: #00aaff;
        padding: 6px 14px;
        border-radius: 20px;
      }
      .nav-links {
        display: flex;
        gap: 20px;
      }
      .nav-links a {
        color: white;
        text-decoration: none;
        font-size: 11px;
        transition: 0.3s;
      }
      .nav-links a:hover,
      .nav-links a.active {
        color: #ffd700;
        text-shadow: 0 0 10px #ffd700;
      }
      .hamburger {
        display: none;
        flex-direction: column;
        cursor: pointer;
        gap: 5px;
      }
      .hamburger div {
        width: 25px;
        height: 3px;
        background: white;
        border-radius: 3px;
        transition: 0.3s;
      }
      @media (max-width: 768px) {
        .nav-links {
          display: none;
          position: absolute;
          top: 70px;
          right: 0;
          background: rgba(10, 10, 40, 0.95);
          flex-direction: column;
          width: 100%;
          text-align: center;
          padding: 15px 0;
        }
        .nav-links.active {
          display: flex;
        }
        .hamburger {
          display: flex;
        }
      }

      .btn-home {
        background: linear-gradient(45deg, #2fba00, #95ff00);
        color: #fffbea;
        padding: 12px 14px;
        border-radius: 15px;
        display: flex;
        align-items: center;
        justify-content: center;
        text-decoration: none;
        font-size: 15px;
        font-family: "Press Start 2P", cursive;
        box-shadow: 0 0 20px rgba(94, 255, 0, 0.9);
        position: fixed;
        bottom: 20px;
        right: 30px;
        z-index: 1100;
        transition: all 0.3s ease-in-out;
        border: 2px solid #c2ffa3;
        text-shadow: 0 0 5px #dfffc1;
      }
      .btn-home:hover {
        transform: scale(1.15) rotate(-3deg);
        box-shadow: 0 0 30px #84ff00;
      }

      .popup {
        display: none;
        justify-content: center;
        align-items: center;
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.385);
        z-index: 1000;
        animation: fadeIn 0.5s ease;
        pointer-events: none;
      }
      .popup-content {
        background: rgba(10, 10, 40, 0.9);
        border: 2px solid #00ff99;
        border-radius: 20px;
        padding: 30px 25px;
        text-align: center;
        color: white;
        width: 80%;
        max-width: 400px;
        box-shadow: 0 0 25px #00ff99;
        animation: slideUp 0.6s ease;
        pointer-events: auto;
      }
      .popup-content h2 {
        color: #00ff99;
        font-size: 16px;
        margin-bottom: 15px;
        text-shadow: 0 0 10px #00ff99;
      }
      .popup-content p {
        font-size: 12px;
        margin-bottom: 20px;
      }
      .popup-content button {
        background: #00aaff;
        color: white;
        border: none;
        border-radius: 10px;
        padding: 10px 18px;
        font-family: "Press Start 2P", cursive;
        font-size: 10px;
        cursor: pointer;
        box-shadow: 0 0 15px #00aaff;
        transition:
          transform 0.3s ease,
          box-shadow 0.3s ease;
      }
      .popup-content button:hover {
        transform: scale(1.05);
        box-shadow: 0 0 25px #00ccff;
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }
      @keyframes slideUp {
        from {
          transform: translateY(40px);
          opacity: 0;
        }
        to {
          transform: translateY(0);
          opacity: 1;
        }
      }
      @keyframes glowPulse {
        from {
          text-shadow: 0 0 10px #00ff99;
        }
        to {
          text-shadow: 0 0 25px #00ff99;
        }
      }
    </style>
  </head>

  <body>
    <div class="stars" id="stars"></div>
    <div class="navbar">
      <div class="nav-left">
        <img src="image/logo.jpg" alt="Logo" />
        <div class="nav-title">BIJAK PECAHAN</div>
      </div>
      <div class="nav-links" id="navLinks">
        <a href="index.html">🏠 HALAMAN UTAMA</a>
        <a href="pelajaran.html">✏️ PELAJARAN</a>
        <a href="latihan.html" class="active">🗒️ LATIHAN</a>
      </div>
      <div class="hamburger" id="hamburger">
        <div></div>
        <div></div>
        <div></div>
      </div>
    </div>

    <a href="latihan.html" class="btn-home">🏠</a>

    <script></script>
  </body>
</html>
